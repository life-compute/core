[package]
name = "life-core"
version = "0.1.0"
description = "LIFE Compute — decentralized cancer drug discovery on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "life_core"

[features]
# launch = enabled by default for mainnet and the devnet trial.
# Under launch: payout_batch is the ONLY instruction that can mint LIFE.
# mint_reward returns LegacyMintDisabled; claim_discovery_bonus returns DiscoveryBonusDisabled.
# legacy = old behaviour; used ONLY by tests of the old logic (mint_reward + claim_discovery_bonus).
# Exactly one of launch or legacy should be active at build time.
default = ["launch"]
launch = []
legacy = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Build with `--features mainnet` to embed the Squads multisig vault address
# (AGKvdA3ipuyparVHQi4n7XAhzPsSU4ukp3u7dUg2z3wm) as REGISTRATION_FEE_RECIPIENT.
# Default (no feature): uses devnet/test address 8NQtHtcA839wPSfphsAuPCbfCajvFY5tmcWXKWsk1L84.
mainnet = []

[dependencies]
anchor-lang   = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl    = { version = "0.30.1", features = ["token", "associated_token"] }
