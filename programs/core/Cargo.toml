[package]
name = "life-core"
version = "0.1.0"
description = "LIFE Compute — decentralized cancer drug discovery on Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "life_core"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Build with `--features mainnet` to embed the Squads multisig vault address
# (AGKvdA3ipuyparVHQi4n7XAhzPsSU4ukp3u7dUg2z3wm) as REGISTRATION_FEE_RECIPIENT.
# Default (no feature): uses devnet/test address 8NQtHtcA839wPSfphsAuPCbfCajvFY5tmcWXKWsk1L84.
mainnet = []

[dependencies]
anchor-lang   = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl    = { version = "0.30.1", features = ["token", "associated_token"] }
